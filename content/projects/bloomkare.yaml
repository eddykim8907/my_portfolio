highlight: Thousands of registered accounts · Hundreds of daily active users
context: >
  A production seeding platform with an internal campaign ERP and a creator-facing
  product. It replaced a spreadsheet-heavy campaign workflow and now has thousands
  of registered accounts and hundreds of daily active users.
contributionGroups:
  - title: Ownership
    items:
      - Sole developer from planning and architecture through full-stack development, deployment, and production maintenance
      - Designed and built the internal campaign-management ERP and the creator-facing product, including applications, gamification, fulfillment, and video submissions
      - Worked with the UX/UI designer and project manager to turn product requirements and integration plans into production systems
  - title: Campaign automation
    items:
      - Replaced a mostly spreadsheet-based creator seeding workflow with a campaign management platform
      - Automated campaign applications, creator evaluation, fulfillment tracking, submission deadlines, and campaign reporting
      - Built creator scoring that auto-accepted or rejected applicants against set criteria, so ops did not have to review every profile by hand
  - title: Integrations & backend
    items:
      - Integrated TikTok APIs and access-token workflows to collect creator and content data and automate campaign fulfillment checks
      - Integrated EasyPost and ShipStation webhooks to keep shipment status in sync, plus Amazon SP-API for product-related campaign work
      - Connected Google APIs and Forsit's internal systems into the campaign workflow
      - Implemented scheduled jobs for deadline enforcement, campaign processing, and result updates
  - title: Infrastructure
    items:
      - Handled auth, backend data flows, third-party integrations, and production infrastructure
      - Set up CI/CD, Coolify deployment, logging, and monitoring, and kept the app running in production
impact: >
  The platform grew to thousands of registered accounts and hundreds of daily
  active users. Before that, the same work lived in spreadsheets: creator research,
  data entry, fulfillment tracking, video checks, and reporting.
